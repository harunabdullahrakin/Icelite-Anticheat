<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="iceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc" />
      <stop offset="35%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.8" />
    </linearGradient>
    <filter id="iceGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  
  <circle cx="100" cy="100" r="75" fill="#38bdf8" opacity="0.15" filter="url(#iceGlow)"/>

  
  <path d="M100 22 L162 48 V105 C162 142 135 171 100 182 C65 171 38 142 38 105 V48 Z" 
        stroke="url(#glowGrad)" stroke-width="3" fill="#0b1329" fill-opacity="0.75" />

  
  <path d="M100 32 L150 54 V102 C150 134 128 158 100 168 C72 158 50 134 50 102 V54 Z" 
        fill="url(#iceGrad)" opacity="0.25"/>

  
  <polygon points="100,45 128,96 100,152 72,96" fill="url(#iceGrad)" filter="url(#iceGlow)" opacity="0.95" />
  
  
  <polygon points="100,45 128,96 100,108" fill="#e0f2fe" opacity="0.85"/>
  <polygon points="100,45 72,96 100,108" fill="#38bdf8" opacity="0.6"/>
  <polygon points="100,152 128,96 100,108" fill="#1d4ed8" opacity="0.7"/>
  <polygon points="100,152 72,96 100,108" fill="#0284c7" opacity="0.8"/>

  
  <circle cx="100" cy="102" r="3.5" fill="#ffffff" filter="url(#iceGlow)"/>
</svg>
